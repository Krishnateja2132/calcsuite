<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/calculator.css') }}">
</head>

<body>

    <div class="calculator">

        <h1>Scientific Calculator</h1>

        <input
            type="text"
            id="display"
            class="display"
            placeholder="0"
            readonly>

        <div class="buttons">

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>+</button>

            <button>C</button>
            <button id="sqrt">√</button>

            <button id="square">x²</button>

            <button id="percent">%</button>

        </div>

    </div>
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
